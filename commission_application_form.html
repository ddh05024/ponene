<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f3ee">
  <title>커미션 신청서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{--bg:#f6f3ee;--paper:#fff;--ink:#292521;--muted:#817970;--line:#e8e1d8;--accent:#b75b54;--tint:#fff0ee}*{box-sizing:border-box}body{margin:0;padding:24px 16px 64px;background:var(--bg);color:var(--ink);font:14px/1.55 'Noto Sans KR',sans-serif}.wrap{max-width:760px;margin:auto}.privacy{margin:0 0 18px;padding:13px 15px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;background:#fff;font-size:12.5px}.privacy b{display:block;font-size:13px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{appearance:none;border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:#fff;color:var(--ink);font:700 13px inherit;cursor:pointer}.tab.on{border-color:var(--accent);background:var(--accent);color:#fff}.panel[hidden]{display:none}.card{padding:32px 34px 20px;border:1px solid #ede8e2;border-radius:17px;background:var(--paper);box-shadow:0 2px 16px #38291b0b}.head{padding-bottom:15px;border-bottom:2px solid var(--ink)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;color:var(--accent)}h1{margin:4px 0 0;font-size:29px;line-height:1.25;letter-spacing:-.04em}h2{display:flex;align-items:center;gap:8px;margin:27px 0 10px;font-size:15px}.number{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px}.hint,.desc{color:var(--muted);font-size:12px;font-weight:400}.desc{margin:-4px 0 11px}.grid{display:grid;gap:13px}.grid.two{grid-template-columns:1fr 1fr}.upload{display:block;cursor:pointer}.preview{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed #ccc4bb;border-radius:12px;background:#fbfaf8 center/cover no-repeat;color:#9c948c;font-size:13px;overflow:hidden}.preview.wide{aspect-ratio:16/7}.preview.has{border-style:solid;border-color:var(--line)}.preview.has span{display:none}.upload input{display:none}.upload-label{display:flex;justify-content:space-between;min-height:25px;padding:6px 1px 0;font-size:13px;font-weight:700}.remove{appearance:none;visibility:hidden;border:0;background:transparent;color:var(--muted);font:12px inherit;text-decoration:underline;cursor:pointer}.has+.upload-label .remove{visibility:visible}.color-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:9px 13px;border:1px solid var(--line);border-radius:10px}.color-row label{flex:1}.swatch{position:relative;width:29px;height:29px;overflow:hidden;border:1px dashed #bdb5ac;border-radius:50%;background:#fff}.swatch.set{border-style:solid}.swatch input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}.hex,.text-input,textarea,input[type=date]{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:14px inherit}.hex{width:104px;padding:6px 8px;text-transform:uppercase}.text-input,textarea{width:100%;padding:11px 13px}.text-input{height:43px}textarea{min-height:82px;resize:vertical}.choices{display:grid;gap:8px}.choice{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.choice input{position:absolute;opacity:0}.mark{width:19px;height:19px;flex:0 0 19px;border:1.5px solid #bbb2a8;border-radius:5px}.choice input[type=radio]+.mark{border-radius:50%}.choice input:checked+.mark{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px #fff}.choice:has(input:checked){border-color:var(--accent);background:var(--tint)}.choice span:nth-child(3){flex:1}.price{color:var(--accent);font-size:12.5px;font-weight:800}.date{padding:10px 13px}.summary{padding:13px 15px;border-radius:12px;background:var(--tint)}.summary div{display:flex;justify-content:space-between;gap:16px;padding:2px 0}.summary b{color:var(--accent)}.total{margin-top:6px;padding-top:7px;border-top:1px solid #e6c9c4;font-weight:800}.total b{font-size:16px}.foot{margin-top:21px;color:#aaa29a;text-align:right;font-size:11px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.save{appearance:none;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:13px 24px;font:800 15px inherit;cursor:pointer}.save:disabled{opacity:.6}.small{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:20px;background:#0008}.modal.show{display:grid}.modal-box{width:min(360px,100%);padding:27px 25px;text-align:center;border-radius:16px;background:#fff}.modal-box h3{margin:0 0 4px;font-size:18px}.modal-box p{margin:0;color:var(--muted);font-size:13px}.cta{display:block;margin-top:18px;padding:13px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800}.close{margin-top:9px;border:0;background:none;color:var(--muted);font:13px inherit;cursor:pointer}.exporting .hide-export,.export-only{display:none}.exporting .export-only{display:block}.exporting .empty{display:none!important}.exporting .card{box-shadow:none}@media(max-width:540px){body{padding:16px 12px 45px}.card{padding:24px 18px 17px}h1{font-size:24px}.grid.two{grid-template-columns:1fr}.tabs{gap:6px}.tab{padding:8px 11px;font-size:12px}}
  </style>
</head>
<body>
  <main class="wrap">
    <aside class="privacy"><b>🔒 업로드한 이미지와 입력 내용은 이 브라우저 안에서만 처리돼요.</b>서버에 전송되거나 저장되지 않아요. 작성 후 PNG를 꼭 저장해 주세요.</aside>
    <nav class="tabs" aria-label="커미션 종류"><button class="tab on" data-tab="paw">냥발 헤더</button><button class="tab" data-tab="omelette">오므라이스</button><button class="tab" data-tab="badge">핀뱃지 스쿨룩</button></nav>
    <section class="panel" id="paw"></section><section class="panel" id="omelette" hidden></section><section class="panel" id="badge" hidden></section>
  </main>
  <div class="modal" id="modal"><div class="modal-box"><h3>PNG 저장이 완료됐어요 🎉</h3><p>저장된 신청서 이미지를 첨부해 주세요.</p><a class="cta" href="https://kre.pe/0vc6" target="_blank" rel="noopener">크레페에서 신청하기</a><button class="close" type="button">닫기</button></div></div>
  <script>
    const types={paw:{name:'냥발 헤더',price:20000,detail:'1페어 · 일반 / 자글자글 PNG 각 1장',fields:()=>section('캐릭터 얼굴 이미지',`<div class="grid two">${upload('캐릭터 A 얼굴')}${upload('캐릭터 B 얼굴')}</div>`)+section('배경 컬러',color('배경 컬러'))},omelette:{name:'오므라이스',price:10000,detail:'1인 · 일반 / 자글자글 PNG 각 1장',fields:()=>section('캐릭터 얼굴 이미지',upload('캐릭터 얼굴'))+section('표정',input('원하는 표정을 적어 주세요.'))+section('오브젝트',input('함께 넣을 오브젝트 1개를 적어 주세요.'))+section('이름',input('영문 또는 일문 이름을 적어 주세요.'))},badge:{name:'핀뱃지 스쿨룩',price:10000,detail:'1인 · 파일 그대로 핀뱃지 인쇄 가능',fields:()=>section('캐릭터 얼굴 이미지',upload('캐릭터 얼굴'))+section('상징 컬러',color('상징 컬러'))+section('상징 오브젝트',input('상징 오브젝트 2~3가지를 적어 주세요.'))+section('타입 선택',choices('type',['악마','천사'],true))+section('의상',`<p class="desc">각 항목에서 하나씩 선택해 주세요.</p>${choices('sleeve',['긴팔','반팔'],true)}${choices('top',['넥타이','티셔츠'],true)}`)+section('바지 컬러',color('바지 컬러'))}};
    const EXTRA=[['24시간 추가금 ×2','x2',0],['굿즈 제작 +0.5','goods',5000],['비공개 +0.5','private',5000]];
    let active='paw';
    function section(title,html){return `<div class="form-section"><h2><i class="number"></i>${title}</h2>${html}</div>`}
    function upload(label){return `<label class="upload"><div class="preview"><span>+ 이미지 업로드</span></div><input type="file" accept="image/*"><div class="upload-label"><span>${label}</span><button class="remove hide-export" type="button">삭제</button></div></label>`}
    function input(placeholder){return `<div class="field"><input class="text-input hide-export" type="text" placeholder="${placeholder}"><div class="export-only value">—</div></div>`}
    function color(label){return `<div class="color-row"><label>${label}</label><span class="swatch"><input type="color" value="#ffffff" aria-label="${label} 선택"></span><input class="hex hide-export" maxlength="7" placeholder="#RRGGBB"><span class="export-only color-value">—</span></div>`}
    function choices(group,items,radio=false){return `<div class="choices">${items.map(x=>`<label class="choice"><input type="${radio?'radio':'checkbox'}" name="${group}" value="${x}"><i class="mark"></i><span>${x}</span></label>`).join('')}</div>`}
    function card(type){const t=types[type];return `<article class="card"><header class="head"><div class="eyebrow">커미션 신청서</div><h1>${t.name}</h1><p class="desc">${t.detail}</p></header>${t.fields()}${section('추가금 옵션 <span class="hint">해당 시 체크</span>',`<div class="choices">${EXTRA.map(([label,id,price])=>`<label class="choice"><input type="checkbox" data-extra="${id}" data-price="${price}"><i class="mark"></i><span>${label}</span>${price?`<b class="price">+5,000원</b>`:''}</label>`).join('')}</div>`)}${section('희망 마감일',`<input class="date hide-export" type="date"><div class="export-only date-value">—</div>`)}${section('요청사항',`<div class="field"><textarea class="hide-export" placeholder="추가로 전달하고 싶은 내용을 자유롭게 적어 주세요."></textarea><div class="export-only value">—</div></div>`)}${section('금액 요약',`<div class="summary"></div>`)}<footer class="foot">COMMISSIONS</footer></article><div class="actions hide-export"><button class="save" type="button">PNG로 저장하기</button><span class="small">입력한 내용과 첨부 이미지가 담겨 저장돼요.</span></div>`}
    Object.keys(types).forEach(id=>{document.getElementById(id).innerHTML=card(id);wire(document.getElementById(id),id)});
    function numberSections(panel){panel.querySelectorAll('.number').forEach((n,i)=>n.textContent=i+1)}
    function wire(panel,id){numberSections(panel);panel.querySelectorAll('.upload').forEach(box=>{const input=box.querySelector('input'),preview=box.querySelector('.preview'),remove=box.querySelector('.remove');input.addEventListener('change',()=>{const f=input.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{preview.style.backgroundImage=`url("${reader.result}")`;preview.classList.add('has')};reader.readAsDataURL(f)});remove.addEventListener('click',e=>{e.preventDefault();input.value='';preview.style.backgroundImage='';preview.classList.remove('has')})});panel.querySelectorAll('.color-row').forEach(row=>{const picker=row.querySelector('[type=color]'),hex=row.querySelector('.hex'),swatch=row.querySelector('.swatch'),out=row.querySelector('.color-value');const set=v=>{if(!/^#[0-9A-F]{6}$/i.test(v))return;v=v.toUpperCase();picker.value=v;hex.value=v;out.textContent=v;swatch.style.background=v;swatch.classList.add('set')};picker.addEventListener('input',()=>set(picker.value));hex.addEventListener('input',()=>{let v=hex.value.trim();if(v&&!v.startsWith('#'))v='#'+v;hex.value=v.toUpperCase();if(v.length===7)set(v)});});panel.querySelectorAll('.field input,.field textarea').forEach(el=>el.addEventListener('input',()=>el.parentElement.querySelector('.value').textContent=el.value.trim()||'—'));const date=panel.querySelector('.date');date.addEventListener('change',()=>panel.querySelector('.date-value').textContent=date.value?date.value.replaceAll('-','. '):'—');panel.addEventListener('change',()=>updateTotal(panel,id));updateTotal(panel,id);panel.querySelector('.save').addEventListener('click',()=>save(panel,id))}
    function money(n){return n.toLocaleString('ko-KR')+'원'}
    function updateTotal(panel,id){const base=types[id].price;let additions=0;let x2=false;panel.querySelectorAll('[data-extra]:checked').forEach(x=>{if(x.dataset.extra==='x2')x2=true;else additions+=Number(x.dataset.price)});const total=(base+additions)*(x2?2:1);let rows=`<div><span>기본 금액</span><b>${money(base)}</b></div>`;if(additions)rows+=`<div><span>추가금</span><b>+${money(additions)}</b></div>`;if(x2)rows+=`<div><span>24시간 추가금</span><b>최종 금액 ×2</b></div>`;panel.querySelector('.summary').innerHTML=rows+`<div class="total"><span>합계</span><b>${money(total)}</b></div>`}
    async function save(panel,id){const button=panel.querySelector('.save'),card=panel.querySelector('.card');if(!window.html2canvas){alert('PNG 저장 도구를 불러오지 못했어요. 인터넷 연결 후 다시 시도해 주세요.');return}button.disabled=true;button.textContent='저장 중…';card.classList.add('exporting');try{const canvas=await html2canvas(card,{scale:Math.max(2,1440/card.offsetWidth),backgroundColor:'#ffffff',useCORS:true});const link=document.createElement('a');link.href=canvas.toDataURL('image/png');link.download=`${types[id].name}_신청서.png`;link.click();document.getElementById('modal').classList.add('show')}catch(e){alert('PNG 저장에 실패했어요. 다시 시도해 주세요.')}finally{card.classList.remove('exporting');button.disabled=false;button.textContent='PNG로 저장하기'}}
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==active)}));document.querySelector('.close').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};
  </script>
</body>
</html>
